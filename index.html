function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.add('hidden'),3000)}
function isMobileMenuOpen(){return document.getElementById('mobile-menu-toggle')?.getAttribute?.('aria-expanded')==='true'}
function setMobileMenu(open,returnFocus=false){
 const trigger=document.getElementById('mobile-menu-toggle');
 const menu=document.getElementById('mobile-menu');
 const scrim=document.getElementById('mobile-menu-scrim');
 if(!trigger||!menu||!scrim)return;
 menu.hidden=!open;scrim.hidden=!open;
 trigger.setAttribute?.('aria-expanded',String(open));
 trigger.setAttribute?.('aria-label',open?'Cerrar menú':'Abrir menú');
 document.body?.classList?.toggle?.('mobile-menu-open',open);
 if(open)menu.querySelector?.('button')?.focus?.();
 else if(returnFocus)trigger.focus?.();
}
function toggleMobileMenu(){setMobileMenu(!isMobileMenuOpen())}
function closeMobileMenu(returnFocus=false){setMobileMenu(false,returnFocus)}
document.addEventListener?.('keydown',event=>{
 if(!isMobileMenuOpen())return;
 if(event.key==='Escape'){event.preventDefault();closeMobileMenu(true);return}
 if(event.key!=='Tab')return;
 const trigger=document.getElementById('mobile-menu-toggle');
 const menu=document.getElementById('mobile-menu');
 const focusable=[trigger,...(menu?.querySelectorAll?.('button')||[])].filter(Boolean);
 if(!focusable.length)return;
 const activeIndex=focusable.indexOf(document.activeElement);
 if(event.shiftKey && activeIndex===0){event.preventDefault();focusable[focusable.length-1].focus()}
 else if(!event.shiftKey && activeIndex===focusable.length-1){event.preventDefault();focusable[0].focus()}
});
window.addEventListener?.('resize',()=>{if(window.innerWidth>680 && isMobileMenuOpen())closeMobileMenu()});
function go(p){window.MusaMoodboards.close();closeMobileMenu();page=p;render();window.scrollTo(0,0);if(p==='explorar'&&!inspiration.searched)lookupInspiration()}

function palette(colors,variant=''){
 const swatches=Array.isArray(colors)?colors.filter(color=>typeof color==='string'&&/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)):[];
 if(!swatches.length)return '';
 const paletteClass=variant==='favorite'?'palette idea-glass-palette':'palette';
 return '<div class="'+paletteClass+'" role="group" aria-label="Paleta de colores sugerida">'+
  swatches.map((color,index)=>'<span class="swatch" role="img" aria-label="Color '+(index+1)+': '+color+'" style="background-color:'+color+'"></span>').join('')+
  '</div>';
}

function randomWriting(){

}
function changeWritingMode(mode){
 if(mode!=='question'&&mode!=='image')return;
 writingMode=mode;writingImage=null;writingImageLoading=false;writingImageRequest++;
 render();

async function loadWritingImage(force=false){
 const prompt=currentWriting,request=++writingImageRequest;
 writingImageLoading=true;writingImage=null;render();
 try{
  const ref=await window.MusaWriting.loadImage(prompt,force);
  if(request!==writingImageRequest||currentWriting!==prompt||writingMode!=='image')return;
  writingImage=ref;
 }catch(_e){if(request!==writingImageRequest)return;writingImage=null;}
 if(request===writingImageRequest){writingImageLoading=false;if(page==='explorar')render()}
}
function reloadWritingImage(){loadWritingImage(true)}
function saveWriting(){

}
function startWriting(itemOverride){

function updateWritingDraft(text){

function start(item){data.active={id:crypto.randomUUID(),item,startedAt:new Date().toISOString(),elapsed:0};save();seconds=0;paused=true;go('sesion')}
function tick(){if(!paused){seconds++;document.getElementById('clock').textContent=fmt(seconds)}}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function toggleTimer(){paused=!paused;if(!interval)interval=setInterval(tick,1000);render()}
function endSession(){paused=true;clearInterval(interval);interval=null;if(data.active){data.active.elapsed=seconds;save()}go('registrar')}
function abandon(){if(confirm('¿Descartar esta sesión?')){paused=true;clearInterval(interval);interval=null;data.active=null;save();go('inicio')}}
async function register(){
 if(!data.active)return;
 const button=document.getElementById('save-art');
 if(button)button.disabled=true;
 const title=document.getElementById('arttitle').value.trim()||data.active.item.title;
 const notes=document.getElementById('notes').value.trim();
 const file=document.getElementById('artfile').files[0];
 const id=crypto.randomUUID();
 try{
   let imagePath='';
   if(file){
     if(file.size>6e6)throw Error('Elige una imagen menor de 6 MB');
     const blob=await new Promise((resolve,reject)=>{
       const img=new Image(),url=URL.createObjectURL(file);
       img.onload=()=>{
         const canvas=document.createElement('canvas'),scale=Math.min(1,1100/Math.max(img.width,img.height));
         canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
         canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
         URL.revokeObjectURL(url);
         canvas.toBlob(b=>b?resolve(b):reject(Error('No se pudo comprimir la imagen')),'image/jpeg',.7);
       };
       img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('No se pudo leer la imagen'))};
       img.src=url;
     });
     imagePath=await window.MusaAuth.uploadArtwork(id,blob);
   }
   const a={id,title,notes,image:'',imagePath,createdAt:new Date().toISOString(),source:data.active.item};
   data.artworks.unshift(a);
   data.sessions.unshift({id:data.active.id,title:data.active.item.title,type:data.active.item.type,elapsed:data.active.elapsed,createdAt:a.createdAt,artworkId:a.id});
   data.active=null;save();toast('¡Obra guardada! Sincronizando…');go('estudio');
 }catch(e){toast(e.message||'No pudimos guardar tu obra')}
 finally{if(button)button.disabled=false}
}
function deleteArt(id){if(!confirm('¿Eliminar esta obra de tu estudio?'))return;const a=data.artworks.find(x=>x.id===id);data.artworks=data.artworks.filter(x=>x.id!==id);save();if(a?.imagePath)void window.MusaAuth.removeArtworkFile(a.imagePath);render()}

let inspiration={query:"collage experimental",source:"unsplash",items:[],loading:false,error:"",searched:false,partial:false,requestId:0};
const unavailableReferenceKeys=new Set();
data.references=Array.isArray(data.references)?data.references:[];
initBoards();
function safeHref(raw){try{const u=new URL(raw);return u.protocol==="https:"?u.href:""}catch{return""}}
function inspirationTitle(){return {unsplash:"UNSPLASH",met:"THE MET",artic:"ART INSTITUTE",wikimedia:"WIKIMEDIA",all:"TODAS LAS FUENTES"}[inspiration.source]||"EXPLORAR"}
function chooseSource(source){
  const field=document.getElementById("query");
  if(field)inspiration.query=field.value.trim();
  inspiration.source=source;
  lookupInspiration();
}
async function lookupInspiration(e){
  if(e)e.preventDefault();
  const field=document.getElementById("query");
  if(field)inspiration.query=field.value.trim();
  if(inspiration.query.length<2){toast("Escribe por lo menos dos caracteres");return}
  const requestId=++inspiration.requestId;
  inspiration.loading=true;inspiration.error="";inspiration.searched=true;render();
  try {
    const url="/api/inspiration?q="+encodeURIComponent(inspiration.query)+"&source="+encodeURIComponent(inspiration.source);
    const response=await fetch(url,{headers:{"Accept":"application/json"}});
    const payload=await response.json();
    if(requestId!==inspiration.requestId)return;
    if(!response.ok)throw Error(payload.error||"No fue posible consultar las imágenes");
    if(window.MusaAuth?.isAuthenticated()){data.searches.unshift({id:crypto.randomUUID(),query:inspiration.query,source:inspiration.source,count:Array.isArray(payload.results)?payload.results.length:0,createdAt:new Date().toISOString()});data.searches=data.searches.slice(0,100);save();}
    inspiration.items=Array.isArray(payload.results)?payload.results:[];
    inspiration.partial=Boolean(payload.partial);
  } catch(e){
    if(requestId!==inspiration.requestId)return;
    inspiration.items=[];
    inspiration.error=e?.message||"Ocurrió un problema con la búsqueda";
  } finally{
    if(requestId===inspiration.requestId){inspiration.loading=false;render()}
  }
}
function saveVisualReference(i,boardId){saveReferenceToBoard(i,boardId)}
function removeSavedReference(index){data.references.splice(index,1);save();render()}
function referenceKey(r){return String(r.source||"")+":"+String(r.id||"")}
function referencePlaceholder(){return '<span class="ref-cover-placeholder">'+musaMark()+'<span>Vista previa no disponible</span></span>';}
function repairReferenceImage(img){
 const backup=safeHref(img.dataset.backup);
 if(backup&&!img.dataset.backupTried&&backup!==img.src){img.dataset.backupTried="true";img.src=backup;return;}
 img.onerror=null;
 const card=img.closest(".ref-card");
 if(!card||!card.isConnected)return;
 unavailableReferenceKeys.add(card.dataset.refKey);
 const cover=img.closest(".ref-cover");
 if(card.dataset.savedMode==="true"){
  if(cover){cover.classList.add("ref-cover--unavailable");cover.innerHTML=referencePlaceholder();}
  return;
 }
 card.remove();
 const grid=document.querySelector(".inspire-results .ref-grid");
 if(!grid)return;
 const remaining=grid.querySelectorAll(".ref-card").length;
 const badge=document.querySelector(".inspire-results .badge");
 if(badge)badge.textContent=remaining+" referencias";
 if(!remaining)grid.outerHTML='<div class="inspiration-message" role="status"><h3>NO HAY IMÁGENES DISPONIBLES.</h3><p>Las fuentes no entregaron vistas previas que se puedan mostrar. Prueba otra palabra o fuente.</p></div>';
}
function refCard(r,i,savedMode=false,boardId=""){
 const url=safeHref(r.link),image=safeHref(r.image),backup=safeHref(r.backupImage);
 const photographerURL=safeHref(r.creatorUrl),sourceURL=safeHref(r.sourceUrl);
 const key=referenceKey(r),unavailable=unavailableReferenceKeys.has(key);
 if(!url||(!savedMode&&(!image||unavailable)))return"";
 const sourceNames={unsplash:"Unsplash",met:"The Met",artic:"Art Institute of Chicago",wikimedia:"Wikimedia Commons"};
 const provider=sourceNames[r.source]||"Museo";
 const credit=r.source==="unsplash"?
   "Foto de "+(photographerURL?'<a href="'+esc(photographerURL)+'" target="_blank" rel="noopener noreferrer">'+esc(r.creator)+'</a>':esc(r.creator))+
   " en "+(sourceURL?'<a href="'+esc(sourceURL)+'" target="_blank" rel="noopener noreferrer">Unsplash</a>':"Unsplash"):
   esc(r.creator)+" · "+esc(provider);
 const saved=data.references.some(x=>x.id===r.id&&x.source===r.source);
 const boardOptions = data.boards.map(board => {
   const hasIt = data.references.some(item => referenceKey(item) === key && boardMemberships(item).includes(board.id));
   return '<button type="button" class="ref-save-option'+(hasIt?' is-saved':'')+'" onclick="saveVisualReference('+i+','+
     boardActionArgs(board.id)+')"><span>'+esc(board.name)+'</span><span aria-hidden="true">'+(hasIt?'✓':'↗')+'</span></button>';
 }).join("");
 const button=savedMode?
    '<button type="button" class="btn outline" onclick="removeReferenceFromBoard('+i+','+boardActionArgs(boardId)+')">Quitar del tablero</button>':
    '<details class="ref-save-menu"><summary class="btn '+(saved?'orange':'secondary')+'" aria-label="Guardar '+esc(r.title)+' en un tablero">'+
    (saved?'♥ Organizar':'♡ Guardar')+'</summary><div class="ref-save-options"><span class="ref-save-caption">GUARDAR EN TABLERO</span>'+
    boardOptions+'<button type="button" class="ref-save-option ref-save-new" onclick="openBoardEditor(&#39;&#39;,'+i+')">+ Nuevo tablero</button></div></details>';
 const preview=unavailable||!image?referencePlaceholder():
   '<img loading="lazy" decoding="async" src="'+esc(image)+'" data-backup="'+esc(backup)+'" onerror="repairReferenceImage(this)" alt="">';
 return '<article class="ref-card" data-ref-key="'+esc(key)+'" data-saved-mode="'+savedMode+'"><a class="ref-cover'+(unavailable||!image?' ref-cover--unavailable':'')+'" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" aria-label="Ver '+esc(r.title)+' en '+esc(provider)+'">'+
   preview+'</a>'+
   '<div class="ref-body"><span class="ref-source">'+esc(provider)+'</span><h3>'+esc(r.title)+'</h3>'+
   '<div class="ref-byline">'+credit+'</div><div class="ref-license">'+esc(r.license||"Consultar derechos en la fuente")+'</div>'+
   '<div class="ref-actions">'+button+'<a class="ref-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Ver original ↗</a></div></div></article>';
}
function renderInspiration(){
 const sources=[["unsplash","Unsplash"],["met","The Met"],["artic","Art Institute"],["wikimedia","Wikimedia"],["all","Todas"]];
 const tabs=sources.map(([id,label])=>
  '<button type="button" class="source-tab '+(inspiration.source===id?"selected":"")+
  '" aria-pressed="'+(inspiration.source===id)+'" data-source="'+id+'" onclick="chooseSource(this.dataset.source)">'+label+'</button>'
 ).join("");
 const search='<div class="inspire-toolbar"><div class="eyebrow">MUSA / INSPIRACIÓN VISUAL '+musaMark()+'</div><h2>BUSCA REFERENCIAS</h2>'+
   '<p class="muted">Busca por concepto, emoción, estilo o técnica. Las imágenes aparecen aquí mismo.</p>'+
   '<form class="inspire-form" onsubmit="lookupInspiration(event)"><div class="field"><label for="query">Tema de inspiración</label>'+
   '<input id="query" name="q" maxlength="100" autocomplete="off" placeholder="Ej. collage experimental" value="'+esc(inspiration.query)+'"></div>'+
   '<button class="btn secondary" type="submit" '+(inspiration.loading?"disabled":"")+'>⌕ Buscar imágenes</button></form>'+
   '<div class="eyebrow">ELIGE UNA FUENTE</div><div class="source-tabs">'+tabs+'</div>'+
   '<div class="external-platforms"><a href="#" onclick="externalSearch(event,&#39;pinterest&#39;)">Pinterest ↗</a>'+
   '<a href="#" onclick="externalSearch(event,&#39;behance&#39;)">Behance ↗</a></div>'+
   '<p class="inspiration-hint">Pinterest y Behance se abren en sus plataformas hasta disponer de acceso oficial para búsquedas integradas.</p></div>';
 const displayItems=inspiration.items.map((r,i)=>({r,i})).filter(({r})=>
   safeHref(r.link)&&safeHref(r.image)&&!unavailableReferenceKeys.has(referenceKey(r)));
 let content="";
 if(inspiration.loading) content='<div class="inspiration-message" role="status"><h3>BUSCANDO TU PRÓXIMA CHISPA…</h3><p>Consultando '+inspirationTitle()+'.</p></div>';
 else if(inspiration.error) content='<div class="inspiration-message" role="alert"><h3>NO PUDIMOS CARGAR ESTA FUENTE.</h3><p>'+esc(inspiration.error)+'</p><div class="row" style="justify-content:center"><button class="btn secondary" onclick="lookupInspiration()">Reintentar ↻</button><button class="btn outline" onclick="chooseSource(&#39;met&#39;)">Probar The Met ↗</button></div></div>';
 else if(inspiration.searched&&!displayItems.length) content='<div class="inspiration-message"><h3>NO APARECIERON REFERENCIAS.</h3><p>Prueba otro concepto, una técnica o una palabra en inglés.</p></div>';
 else if(displayItems.length) content='<div class="ref-grid">'+displayItems.map(({r,i})=>refCard(r,i)).join("")+'</div>';
 const history=(data.searches||[]).length?'<details class="search-history"><summary>Mis búsquedas anteriores ('+data.searches.length+')</summary><div class="search-tags">'+data.searches.slice(0,14).map(s=>'<span class="pill">'+esc(s.query)+' · '+esc(s.source)+'</span>').join('')+'</div></details>':'';
 return search+history+'<section class="inspire-results" aria-live="polite"><div class="sectionhead"><h2>RESULTADOS · '+inspirationTitle()+'</h2>'+
   (displayItems.length?'<span class="badge">'+displayItems.length+' referencias</span>':"")+'</div>'+
   (inspiration.partial?'<p class="inspiration-hint">Algunas fuentes no respondieron, pero puedes explorar los resultados disponibles.</p>':"")+
   content+'</section>';
}


function enrichedChallenge(index){const c=challenges[index];return c?window.MusaMoodboards.enrichChallenge(c):null}
function acceptedChallenge(index){const c=enrichedChallenge(index);return c?(data.acceptedChallenges||[]).find(x=>x.title===c.title):null}
function savedChallenge(index){const c=enrichedChallenge(index);return c?(data.savedChallenges||[]).find(x=>x.title===c.title):null}
function fetchChallengeRefs(index){
 const item=enrichedChallenge(index);
 if(!item)return;
 window.MusaMoodboards.load(item).then(refs=>{
  let changed=false;
  for(const collection of [data.acceptedChallenges||[],data.savedChallenges||[]]){
   const record=collection.find(x=>x.title===item.title);
   if(record&&refs.length&&!(record.moodboardRefs||[]).length){record.moodboardRefs=refs;changed=true}
  }
  if(changed){save();if(page==='retos'||page==='sesion')render()}
 }).catch(()=>{});
}
function acceptChallenge(index,fromModal){
 const c=fromModal||enrichedChallenge(index);if(!c)return;
 if(!Array.isArray(data.acceptedChallenges))data.acceptedChallenges=[];
 const found=data.acceptedChallenges.find(x=>x.title===c.title);
 if(!found)data.acceptedChallenges.unshift({...c,moodboardRefs:window.MusaMoodboards.getRefs(c)});
 else if(window.MusaMoodboards.getRefs(c).length)found.moodboardRefs=window.MusaMoodboards.getRefs(c);
 save();render();fetchChallengeRefs(index);
}
function continueChallenge(index){
 const c=acceptedChallenge(index)||enrichedChallenge(index);if(!c)return;
 start({...c,type:'challenge'});
}
function saveChallenge(index,itemOverride){
 const c=itemOverride||enrichedChallenge(index);if(!c)return;
 if(!Array.isArray(data.savedChallenges))data.savedChallenges=[];
 const record=data.savedChallenges.find(x=>x.title===c.title);
 if(!record)data.savedChallenges.unshift({...c,moodboardRefs:window.MusaMoodboards.getRefs(c)});
 else if(window.MusaMoodboards.getRefs(c).length)record.moodboardRefs=window.MusaMoodboards.getRefs(c);
 save();toast('Reto guardado');if(page==='retos')render();fetchChallengeRefs(index);
}
function freshChallenges(){challengeFeed=window.MusaMoodboards.initialChallenges(challenges);render()}
function renderChallenges(){
 const filters=['todos','5','15','20','30','45','60'];
 const pins=new Set([...(data.acceptedChallenges||[]),...(data.savedChallenges||[])].map(x=>x.title));
 const visible=filter==='todos'
  ?challenges.filter(c=>pins.has(c.title)||challengeFeed.includes(c.title))
  :challenges.filter(c=>c.time===Number(filter));
 visible.sort((a,b)=>{
   if(filter!=='todos')return 0;
   const p=c=>pins.has(c.title)?-1:challengeFeed.indexOf(c.title);
   return p(a)-p(b);
 });
 return '<div class="pills" role="group" aria-label="Filtrar retos por duración">'+filters.map(v=>
  '<button type="button" class="pill" aria-pressed="'+(filter===v)+'" style="'+(filter===v?'background:#d7ff42;':'')+'" onclick="filter=\''+v+'\';render()">'+(v==='todos'?'Todos':v+' min')+'</button>'
 ).join('')+'</div><div class="grid mb-challenge-grid">'+visible.map(c=>{
  const index=challenges.indexOf(c);
  return window.MusaMoodboards.challengeCard(c,index,acceptedChallenge(index),savedChallenge(index));
 }).join('')+'</div>';
}
function renderIdeaActions(){
 return '<div class="row mb-idea-tools">'+
 '<button type="button" class="btn" onclick="randomIdea()">↻ Otra idea</button>'+
 '<button type="button" class="btn orange" onclick="fav()">♡ Guardar</button>'+
 '<button type="button" class="mb-outline-button" onclick="openMoodboard(\'idea\')">▧ Ver moodboard</button>'+
 '<button type="button" class="btn" onclick="start(currentIdea)">Crear ↗</button></div>';
}
function openMoodboard(type,index){
 const item=type==='challenge'?enrichedChallenge(index):
  type==='favorite'?(data.favorites||[]).find(x=>x.id===index):
  type==='active'?data.active?.item:currentIdea;
 if(!item)return;
 window.MusaMoodboards.open(item,{
  accept:c=>{
   if(type==='challenge')acceptChallenge(index,c);
   else start(c);
  },
  save:c=>{
   if(type==='challenge')saveChallenge(index,c);
   else fav(c);
  }
 });
}
