ckground:white;min-width:0}.card.lime{background:#d7ff42}.card.orange{background:#ff7049}.card.purple{background:#3926ce;color:white}.card.ink{background:#211b36;color:white}.card p{margin:10px 0 18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.muted{color:#6f6874}.card.purple .muted,.card.ink .muted{color:#d4cfe3}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:26px 0 14px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.pill{border:1px solid #211b3630;border-radius:40px;padding:7px 12px;font-size:12px;font-weight:700;background:#ffffffc9;color:#211b36}.palette{display:flex;gap:6px;margin:20px 0}.swatch{height:65px;flex:1;border-radius:12px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:800}.field input,.field textarea,.field select{padding:13px;border:1px solid #ccc4bf;border-radius:12px;background:white;color:#211b36;width:100%}.field textarea{min-height:95px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.idea-title{font-size:clamp(30px,5vw,48px);line-height:1.05}.empty{text-align:center;padding:50px 20px;background:#fff;border:2px dashed #cfc6c0;border-radius:24px}.empty b{font-size:24px;font-family:'Space Grotesk'}.art-thumb{height:190px;border-radius:14px;display:grid;place-items:center;font-size:70px;background:linear-gradient(135deg,#3926ce,#ff7049,#d7ff42);overflow:hidden}.art-thumb img{width:100%;height:100%;object-fit:cover}.stat{font-family:'Space Grotesk';font-size:44px;font-weight:700}.hidden{display:none!important}.toast{position:fixed;bottom:100px;right:20px;background:#211b36;color:white;padding:13px 20px;border-radius:12px;z-index:9;box-shadow:0 12px 30px #0003}.searchlinks a{color:#3926ce;font-weight:700;display:inline-block;padding:9px;background:#ece7ff;border-radius:10px;margin:4px;text-decoration:none}.foot{font-size:12px;color:#706a73;padding:28px 0}.upload{padding:20px;border:2px dashed #bdb3ba;border-radius:14px;background:#faf8f4}.badge{background:#d7ff42;color:#211b36;border-radius:40px;padding:7px 12px;font-weight:800;font-size:12px} .timer{font-family:'Space Grotesk';font-size:clamp(55px,12vw,100px);font-weight:700;letter-spacing:-.08em}.full{grid-column:1/-1}@media(max-width:680px){header{padding:12px 20px}.nav{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:8;justify-content:space-around;border-top:1px solid #ddd;padding:8px 5px max(8px,env(safe-area-inset-bottom))}.bottom button{font-size:11px;display:grid;justify-items:center;gap:4px;padding:9px 6px;min-width:23%}.bottom span{font-size:20px}main{padding:18px 16px 110px}.grid{grid-template-columns:1fr;gap:12px}.hero{padding:30px 24px}.hero:after{font-size:170px;right:-30px;bottom:-50px;opacity:.35}.card{padding:21px}h2{font-size:28px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* Explorador visual MUSA */
.inspire-toolbar{background:#fff;border-radius:22px;padding:22px;margin-top:18px}
.inspire-form{display:flex;gap:10px;align-items:end;margin:13px 0}.inspire-form .field{flex:1;margin:0}
.inspire-form .btn{height:49px;white-space:nowrap}.source-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}

</style></head><body><header><div class="brand">MUSA<span>✳</span></div><nav class="nav" id="nav"></nav><div id="account-menu"></div></header><main id="app"></main><nav class="bottom" id="bottom"></nav><div id="toast" class="toast hidden" role="status"></div><script>
const KEY='musa-v1',initial={favorites:[],artworks:[],sessions:[],active:null};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...initial}}let page='inicio',currentIdea=null,seconds=0,interval=null,paused=true,filter='todos';
const prompts=[['Representa la nostalgia sin dibujar personas','Nostalgia','Collage','Recuerdos', ['#b76e50','#e5c9a8','#73849a']],['¿De qué color es el silencio?','Calma','Abstracción','Sensaciones',['#a8cbb7','#e7e3d4','#5c8390']],['Inventa un recuerdo del futuro','Curiosidad','Ilustración','Tiempo',['#3926ce','#ff7049','#d7ff42']],['Dibuja una ciudad que respira','Asombro','Dibujo','Arquitectura',['#f5b335','#a458b9','#34337c']],['Haz un autorretrato sin mostrar tu rostro','Identidad','Fotografía','Retrato',['#ff7049','#211b36','#f4ede4']],['Convierte un error en una obra','Libertad','Técnica mixta','Experimentación',['#d7ff42','#3926ce','#ee8fbd']],['Crea un paisaje con objetos cotidianos','Juego','Collage','Paisaje',['#62a9b2','#eab34f','#d45d58']],['Representa el sonido de tu infancia','Melancolía','Abstracción','Memoria',['#73849a','#d4a6c8','#ebd2aa']]];
const challenges=[{title:'Tres colores, un universo',time:15,level:'Fácil',text:'Crea una composición usando únicamente tres colores y formas geométricas.'},{title:'El objeto imposible',time:30,level:'Medio',text:'Transforma un objeto cotidiano en algo que desafíe las leyes de la realidad.'},{title:'Sin levantar el lápiz',time:5,level:'Fácil',text:'Dibuja una escena completa usando una sola línea continua.'},{title:'Un recuerdo en pedazos',time:45,level:'Medio',text:'Construye un collage que evoque un recuerdo sin representarlo literalmente.'},{title:'Texturas de tu mundo',time:20,level:'Fácil',text:'Encuentra cinco texturas a tu alrededor y combínalas en una composición.'},{title:'Lo que no tiene nombre',time:60,level:'Avanzado',text:'Representa visualmente una emoción que no sepas describir con palabras.'}];
function save(){if(window.MusaAuth?.isAuthenticated()){window.MusaAuth.queueSave();return true}return false}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.add('hidden'),3000)}
function go(p){page=p;render();window.scrollTo(0,0);if(p==='explorar'&&!inspiration.searched)lookupInspiration()}function nav(){const items=[['inicio','⌂','Inicio'],['explorar','✳','Explorar'],['estudio','▧','Mi estudio'],['actividad','◷','Actividad']];for(const id of ['nav','bottom'])document.getElementById(id).innerHTML=items.map(([p,i,t])=>'<button class="'+(page===p?'active':'')+'" onclick="go(\''+p+'\')">'+(id==='bottom'?'<span>'+i+'</span>':'')+t+'</button>').join('')}
function palette(colors){return '<div class="palette">'+colors.map(c=>'<div class="swatch" style="background:'+c+'"></div>').join('')+'</div>'}
function randomIdea(){let n=Math.floor(Math.random()*prompts.length);if(currentIdea&&prompts[n][0]===currentIdea.title)n=(n+1)%prompts.length;let p=prompts[n];currentIdea={id:crypto.randomUUID(),title:p[0],emotion:p[1],technique:p[2],theme:p[3],colors:p[4],type:'idea'};render()}
function fav(){if(!currentIdea)return;data.favorites.unshift({...currentIdea,id:crypto.randomUUID(),createdAt:new Date().toISOString()});save();toast('Idea guardada en favoritos');render()}
function start(item){data.active={id:crypto.randomUUID(),item,startedAt:new Date().toISOString(),elapsed:0};save();seconds=0;paused=true;go('sesion')}
function tick(){if(!paused){seconds++;document.getElementById('clock').textContent=fmt(seconds)}}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function toggleTimer(){paused=!paused;if(!interval)interval=setInterval(tick,1000);render()}
function endSession(){paused=true;clearInterval(interval);interval=null;if(data.active){data.active.elapsed=seconds;save()}go('registrar')}
function abandon(){if(confirm('¿Descartar esta sesión?')){paused=true;clearInterval(interval);interval=null;data.active=null;save();go('inicio')}}
async function register(){
 if(!data.active)return;
 const button=document.getElementById('save-art');
 if(button)button.disabled=true;
 const title=document.getElementById('arttitle').value.trim()||data.active.item.title;
 const notes=document.getElementById('notes').value.trim();
 const file=document.getElementById('artfile').files[0];
 const id=crypto.randomUUID();
 try{
   let imagePath='';
   if(file){
     if(file.size>6e6)throw Error('Elige una imagen menor de 6 MB');
     const blob=await new Promise((resolve,reject)=>{
       const img=new Image(),url=URL.createObjectURL(file);
       img.onload=()=>{
         const canvas=document.createElement('canvas'),scale=Math.min(1,1100/Math.max(img.width,img.height));
         canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
         canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
         URL.revokeObjectURL(url);
         canvas.toBlob(b=>b?resolve(b):reject(Error('No se pudo comprimir la imagen')),'image/jpeg',.7);
       };
       img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('No se pudo leer la imagen'))};
       img.src=url;
     });
     imagePath=await window.MusaAuth.uploadArtwork(id,blob);
   }
   const a={id,title,notes,image:'',imagePath,createdAt:new Date().toISOString(),source:data.active.item};
   data.artworks.unshift(a);
   data.sessions.unshift({id:data.active.id,title:data.active.item.title,type:data.active.item.type,elapsed:data.active.elapsed,createdAt:a.createdAt,artworkId:a.id});
   data.active=null;save();toast('¡Obra guardada! Sincronizando…');go('estudio');
 }catch(e){toast(e.message||'No pudimos guardar tu obra')}
 finally{if(button)button.disabled=false}
}
function deleteArt(id){if(!confirm('¿Eliminar esta obra de tu estudio?'))return;const a=data.artworks.find(x=>x.id===id);data.artworks=data.artworks.filter(x=>x.id!==id);save();if(a?.imagePath)void window.MusaAuth.removeArtworkFile(a.imagePath);render()}
function openArt(id){window.artId=id;go('obra')}

let inspiration={query:"collage experimental",source:"unsplash",items:[],loading:false,error:"",searched:false,partial:false,requestId:0};
data.references=Array.isArray(data.references)?data.references:[];
function safeHref(raw){try{const u=new URL(raw);return u.protocol==="https:"?u.href:""}catch{return""}}
function inspirationTitle(){return {unsplash:"UNSPLASH",met:"THE MET",artic:"ART INSTITUTE",wikimedia:"WIKIMEDIA",all:"TODAS LAS FUENTES"}[inspiration.source]||"EXPLORAR"}
function chooseSource(source){
  const field=document.getElementById("query");
  if(field)inspiration.query=field.value.trim();
  inspiration.source=source;
  lookupInspiration();
}
async function lookupInspiration(e){
  if(e)e.preventDefault();
  const field=document.getElementById("query");
  if(field)inspiration.query=field.value.trim();
  if(inspiration.query.length<2){toast("Escribe por lo menos dos caracteres");return}
  const requestId=++inspiration.requestId;
  inspiration.loading=true;inspiration.error="";inspiration.searched=true;render();
  try {
    const url="/api/inspiration?q="+encodeURIComponent(inspiration.query)+"&source="+encodeURIComponent(inspiration.source);
    const response=await fetch(url,{headers:{"Accept":"application/json"}});
    const payload=await response.json();
    if(requestId!==inspiration.requestId)return;
    if(!response.ok)throw Error(payload.error||"No fue posible consultar las imágenes");
    data.searches.unshift({id:crypto.randomUUID(),query:inspiration.query,source:inspiration.source,count:Array.isArray(payload.results)?payload.results.length:0,createdAt:new Date().toISOString()});data.searches=data.searches.slice(0,100);save();
    inspiration.items=Array.isArray(payload.results)?payload.results:[];
    inspiration.partial=Boolean(payload.partial);
  } catch(e){
    if(requestId!==inspiration.requestId)return;
    inspiration.items=[];
    inspiration.error=e?.message||"Ocurrió un problema con la búsqueda";
  } finally{
    if(requestId===inspiration.requestId){inspiration.loading=false;render()}
  }
}
function saveVisualReference(i){
 const r=inspiration.items[i];if(!r)return;
 const found=data.references.findIndex(x=>x.id===r.id&&x.source===r.source);
 if(found>=0){data.references.splice(found,1);toast("Referencia eliminada de favoritos")}
 else {data.references.unshift({...r,savedAt:new Date().toISOString()});toast("Referencia guardada en MUSA")}
 save();render();
}
function removeSavedReference(index){data.references.splice(index,1);save();render()}
function refCard(r,i,savedMode=false){
 const url=safeHref(r.link),image=safeHref(r.image);
 const photographerURL=safeHref(r.creatorUrl),sourceURL=safeHref(r.sourceUrl);
 if(!url||!image)return"";
 const sourceNames={unsplash:"Unsplash",met:"The Met",artic:"Art Institute of Chicago",wikimedia:"Wikimedia Commons"};
 const provider=sourceNames[r.source]||"Museo";
 const credit=r.source==="unsplash"?
   "Foto de "+(photographerURL?'<a href="'+esc(photographerURL)+'" target="_blank" rel="noopener noreferrer">'+esc(r.creator)+'</a>':esc(r.creator))+
   " en "+(sourceURL?'<a href="'+esc(sourceURL)+'" target="_blank" rel="noopener noreferrer">Unsplash</a>':"Unsplash"):
   esc(r.creator)+" · "+esc(provider);
 const saved=data.references.some(x=>x.id===r.id&&x.source===r.source);
 const button=savedMode?
   '<button type="button" class="btn outline" onclick="removeSavedReference('+i+')">Quitar ♡</button>':
   '<button type="button" class="btn '+(saved?"orange":"secondary")+'" onclick="saveVisualReference('+i+')">'+(saved?"♥ Guardada":"♡ Guardar")+'</button>';
 return '<article class="ref-card"><a class="ref-cover" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" aria-label="Ver '+esc(r.title)+' en '+esc(provider)+'">'+
   '<img loading="lazy" src="'+esc(image)+'" alt="'+esc(r.title)+'"></a>'+
   '<div class="ref-body"><span class="ref-source">'+esc(provider)+'</span><h3>'+esc(r.title)+'</h3>'+
   '<div class="ref-byline">'+credit+'</div><div class="ref-license">'+esc(r.license||"Consultar derechos en la fuente")+'</div>'+
   '<div class="ref-actions">'+button+'<a class="ref-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Ver original ↗</a></div></div></article>';
}
function renderInspiration(){
 const sources=[["unsplash","Unsplash"],["met","The Met"],["artic","Art Institute"],["wikimedia","Wikimedia"],["all","Todas"]];
 const tabs=sources.map(([id,label])=>
  '<button type="button" class="source-tab '+(inspiration.source===id?"selected":"")+
  '" aria-pressed="'+(inspiration.source===id)+'" data-source="'+id+'" onclick="chooseSource(this.dataset.source)">'+label+'</button>'
 ).join("");
 const search='<div class="inspire-toolbar"><div class="eyebrow">MUSA / INSPIRACIÓN VISUAL ✳</div><h2>BUSCA REFERENCIAS</h2>'+
   '<p class="muted">Busca por concepto, emoción, estilo o técnica. Las imágenes aparecen aquí mismo.</p>'+
   '<form class="inspire-form" onsubmit="lookupInspiration(event)"><div class="field"><label for="query">Tema de inspiración</label>'+
   '<input id="query" name="q" maxlength="100" autocomplete="off" placeholder="Ej. collage experimental" value="'+esc(inspiration.query)+'"></div>'+
   '<button class="btn secondary" type="submit" '+(inspiration.loading?"disabled":"")+'>⌕ Buscar imágenes</button></form>'+
   '<div class="eyebrow">ELIGE UNA FUENTE</div><div class="source-tabs">'+tabs+'</div>'+
   '<div class="external-platforms"><a href="#" onclick="externalSearch(event,&#39;pinterest&#39;)">Pinterest ↗</a>'+
   '<a href="#" onclick="externalSearch(event,&#39;behance&#39;)">Behance ↗</a></div>'+
   '<p class="inspiration-hint">Pinterest y Behance se abren en sus plataformas hasta disponer de acceso oficial para búsquedas integradas.</p></div>';
 let content="";
 if(inspiration.loading) content='<div class="inspiration-message" role="status"><h3>BUSCANDO TU PRÓXIMA CHISPA…</h3><p>Consultando '+inspirationTitle()+'.</p></div>';
 else if(inspiration.error) content='<div class="inspiration-message" role="alert"><h3>NO PUDIMOS CARGAR ESTA FUENTE.</h3><p>'+esc(inspiration.error)+'</p><div class="row" style="justify-content:center"><button class="btn secondary" onclick="lookupInspiration()">Reintentar ↻</button><button class="btn outline" onclick="chooseSource(&#39;met&#39;)">Probar The Met ↗</button></div></div>';
 else if(inspiration.searched&&!inspiration.items.length) content='<div class="inspiration-message"><h3>NO APARECIERON REFERENCIAS.</h3><p>Prueba otro concepto, una técnica o una palabra en inglés.</p></div>';
 else if(inspiration.items.length) content='<div class="ref-grid">'+inspiration.items.map((r,i)=>refCard(r,i)).join("")+'</div>';
 const saved=data.references.length?
   '<div class="sectionhead"><h2>REFERENCIAS GUARDADAS ('+data.references.length+')</h2></div><div class="ref-grid">'+
   data.references.map((r,i)=>refCard(r,i,true)).join("")+'</div>':"";
 const history=data.searches.length?'<details class="search-history"><summary>Mis búsquedas anteriores ('+data.searches.length+')</summary><div class="search-tags">'+data.searches.slice(0,14).map(s=>'<span class="pill">'+esc(s.query)+' · '+esc(s.source)+'</span>').join('')+'</div></details>':'';
 return search+history+'<section class="inspire-results" aria-live="polite"><div class="sectionhead"><h2>RESULTADOS · '+inspirationTitle()+'</h2>'+
   (inspiration.items.length?'<span class="badge">'+inspiration.items.length+' referencias</span>':"")+'</div>'+

else if(page==='explorar'){out='<div class="eyebrow">EXPLORAR / IDEAS</div><h1>¿Y SI PROBAMOS ALGO RARO?</h1><div class="grid"><div class="card purple"><div class="eyebrow">GENERADOR MUSA ✳</div>'+(currentIdea?'<h2 class="idea-title">'+esc(currentIdea.title)+'</h2><div class="pills"><span class="pill">'+esc(currentIdea.emotion)+'</span><span class="pill">'+esc(currentIdea.technique)+'</span><span class="pill">'+esc(currentIdea.theme)+'</span></div>'+palette(currentIdea.colors)+'<div class="row"><button class="btn" onclick="randomIdea()">↻ Otra idea</button><button class="btn orange" onclick="fav()">♡ Guardar</button><button class="btn" onclick="start(currentIdea)">Crear ↗</button></div>':'<h2>¿LISTA PARA UNA IDEA?</h2><p>Te propondremos una mezcla inesperada de emoción, técnica y concepto.</p><button class="btn" onclick="randomIdea()">✳ Sorpréndeme</button>')+'</div><div class="card lime"><div class="eyebrow">DESAFÍOS CREATIVOS</div><h2>HAZ ALGO DIFERENTE.</h2><p>Retos cortos o largos para salir de tu zona cómoda.</p><button class="btn secondary" onclick="go(\'retos\')">Explorar retos →</button></div></div><div class="sectionhead"><h2>TUS IDEAS FAVORITAS</h2></div>'+(data.favorites.length?'<div class="grid">'+data.favorites.map(f=>'<div class="card"><h3>'+esc(f.title)+'</h3><div class="pills"><span class="pill">'+esc(f.technique)+'</span></div><button class="btn secondary" onclick="startFavorite(\''+f.id+'\')">Crear con esta idea ↗</button><button class="btn outline" onclick="removeFav(\''+f.id+'\')">Quitar</button></div>').join('')+'</div>':'<div class="empty">Aún no guardas ideas. Genera una y márcala como favorita.</div>')+renderInspiration()}
else if(page==='retos'){out='<div class="eyebrow">EXPLORAR / RETOS</div><h1>HAZLO A TU MANERA.</h1><p>Sin competir. Sin resultados perfectos. Solo el placer de experimentar.</p><div class="pills">'+['todos','5','15','20','30','45','60'].map(v=>'<button class="pill" style="'+(filter===v?'background:#d7ff42;':'')+'" onclick="filter=\''+v+'\';render()">'+(v==='todos'?'Todos':v+' min')+'</button>').join('')+'</div><div class="grid">'+challenges.filter(c=>filter==='todos'||c.time===Number(filter)).map((c,i)=>'<div class="card '+(['lime','orange','purple','ink'][i%4])+'"><div class="eyebrow">'+c.time+' MIN · '+c.level+'</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.text)+'</p><button class="btn '+(i%4<2?'secondary':'')+'" onclick="startChallenge(\''+esc(c.title)+'\')">Aceptar reto ↗</button></div>').join('')+'</div>'}
else if(page==='sesion'){if(!data.active){go('inicio');return}out='<div class="eyebrow">MUSA / SESIÓN CREATIVA</div><div class="card ink"><div class="eyebrow" style="color:#d7ff42">ESTÁS CREANDO ✳</div><h1>'+esc(data.active.item.title)+'</h1><p>Hazlo a tu ritmo. No existe una respuesta correcta.</p><div class="timer" id="clock">'+fmt(seconds)+'</div><div class="row"><button class="btn" onclick="toggleTimer()">'+(paused?'▶ Iniciar / reanudar':'Ⅱ Pausar')+'</button><button class="btn orange" onclick="endSession()">Terminé mi creación ↗</button><button class="btn outline" style="color:white;border-color:white" onclick="abandon()">Descartar</button></div></div>'}
else if(page==='registrar'){out='<div class="eyebrow">FINALIZAR / REGISTRAR</div><h1>¡ESO ES CREAR!</h1><p>Guarda el resultado o simplemente lo que aprendiste. No necesitas una obra terminada.</p><div class="card"><div class="field"><label for="arttitle">Título de tu creación</label><input id="arttitle" value="'+esc(data.active?.item.title||'')+'"></div><div class="field"><label for="notes">¿Qué descubriste?</label><textarea id="notes" placeholder="Una reflexión, un error interesante, una nueva idea..."></textarea></div><div class="field upload"><label for="artfile">Fotografía de tu obra (opcional)</label><input id="artfile" type="file" accept="image/*"><small>La imagen se comprime y guarda en tu espacio privado de MUSA. Máximo 6 MB de origen.</small></div><button id="save-art" class="btn secondary" onclick="register()">Guardar en mi estudio ↗</button></div>'}
else if(page==='estudio'){out='<div class="eyebrow">MI ESTUDIO / GALERÍA PERSONAL</div><h1>TODO LO QUE CREAS CUENTA.</h1><p>Un archivo privado de tus experimentos, ideas y descubrimientos.</p>'+(data.artworks.length?'<div class="grid">'+data.artworks.map(a=>'<div class="card"><div class="art-thumb">'+(a.image?'<img src="'+esc(window.MusaAuth.artworkImage(a))+'" alt="Obra guardada">':'✳')+'</div><p class="eyebrow">'+new Date(a.createdAt).toLocaleDateString('es-CO')+'</p><h3>'+esc(a.title)+'</h3><p>'+esc(a.notes||'Sin reflexión todavía')+'</p><button class="btn secondary" onclick="openArt(\''+a.id+'\')">Ver obra ↗</button></div>').join('')+'</div>':'<div class="empty"><b>TU GALERÍA EMPIEZA AQUÍ.</b><p>Tu primera creación está a una idea de distancia.</p><button class="btn secondary" onclick="go(\'explorar\')">Buscar inspiración ↗</button></div>')}
else if(page==='obra'){let a=data.artworks.find(x=>x.id===window.artId);if(!a){go('estudio');return}out='<button class="btn outline" onclick="go(\'estudio\')">← Mi estudio</button><div class="card" style="margin-top:20px">'+(a.image?'<img src="'+esc(window.MusaAuth.artworkImage(a))+'" alt="Obra" style="max-width:100%;border-radius:16px;max-height:520px">':'<div class="art-thumb">✳</div>')+'<h1>'+esc(a.title)+'</h1><p>'+esc(a.notes||'Sin reflexión')+'</p><p class="muted">'+new Date(a.createdAt).toLocaleString('es-CO')+'</p><button class="btn orange" onclick="deleteArt(\''+a.id+'\');go(\'estudio\')">Eliminar obra</button></div>'}
else if(page==='actividad'){let total=data.sessions.reduce((s,x)=>s+x.elapsed,0);out='<div class="eyebrow">ACTIVIDAD / TU PROCESO</div><h1>CADA INTENTO CUENTA.</h1><div class="grid"><div class="card lime"><div class="eyebrow">SESIONES</div><div class="stat">'+data.sessions.length+'</div></div><div class="card orange"><div class="eyebrow">MINUTOS CREATIVOS</div><div class="stat">'+Math.ceil(total/60)+'</div></div></div><h2>HISTORIAL CREATIVO</h2>'+(data.sessions.length?data.sessions.map(s=>'<div class="card" style="margin-bottom:12px"><div class="eyebrow">'+new Date(s.createdAt).toLocaleDateString('es-CO')+' · '+(s.type==='challenge'?'RETO':'IDEA')+'</div><h3>'+esc(s.title)+'</h3><p>'+fmt(s.elapsed)+' de exploración</p></div>').join(''):'<div class="empty"><b>TU HISTORIA COMIENZA CON UNA IDEA.</b><p>Las sesiones que completes aparecerán aquí.</p><button class="btn secondary" onclick="go(\'explorar\')">Empezar a crear ↗</button></div>')}
app.innerHTML=window.MusaAuth.importBanner()+out+'<footer class="foot"><div>MUSA® · Tu estudio se sincroniza de forma privada con tu cuenta.</div><nav class="legal-links" aria-label="Información legal"><a href="/politica-de-privacidad/">Política de privacidad</a><a href="/terminos-de-uso/">Términos de uso</a><a href="mailto:musacreativelaboratory@gmail.com">Contacto</a></nav></footer>'}
function startChallenge(title){let c=challenges.find(x=>x.title===title);if(c)start({id:crypto.randomUUID(),type:'challenge',title:c.title,description:c.text,time:c.time})}
function startFavorite(id){let f=data.favorites.find(x=>x.id===id);if(f)start({...f,type:'idea'})}
function removeFav(id){data.favorites=data.favorites.filter(f=>f.id!==id);save();render()}
function resume(){seconds=data.active.elapsed||0;paused=true;go('sesion')}
function externalSearch(e,provider){e.preventDefault();let q=encodeURIComponent(document.getElementById('query').value||'arte');let urls={pinterest:'https://www.pinterest.com/search/pins/?q=',behance:'https://www.behance.net/search/projects?search=',unsplash:'https://unsplash.com/s/photos/',met:'https://www.metmuseum.org/art/collection/search?q=',aic:'https://www.artic.edu/collection?q=',wikimedia:'https://commons.wikimedia.org/w/index.php?search='};window.open(urls[provider]+q,'_blank','noopener,noreferrer')}
if(data.active)seconds=data.active.elapsed||0;
