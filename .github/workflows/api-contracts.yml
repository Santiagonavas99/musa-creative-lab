name: MUSA API contracts

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: musa-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspiration-api:
    name: API request validation + provider normalization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test serverless inspiration API without live credentials
        run: node --test tests/inspiration-api.test.cjs
